// 共享构建脚本 - 所有版本子项目共用 (MasaGadget 风格)
// 版本特定配置在各自 gradle.properties 中定义
// 26.x 版本自动启用 Yarn→Mojang 映射转换

// 使用 buildscript + apply plugin 方式支持动态 Loom 版本
buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://jitpack.io" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("net.fabricmc:fabric-loom:${project.loom_version}")
    }
}

apply plugin: "java"
apply plugin: "fabric-loom"
apply plugin: "maven-publish"

// 从 root gradle.properties 设置 group 和 version
group = rootProject.maven_group
version = rootProject.mod_version

// 使用 project properties 直接配置 (MasaGadget 风格)
println "Building: ${project.name} (MC ${project.minecraft_version}) - loom ${project.loom_version}"
def targetJavaVersion = (project.findProperty('java_version') ?: '21') as Integer
def modmenuVersion = project.findProperty('modmenu_version') ?: '11.0.3'

final int mcVersion = project.mcVersion.toString().toInteger()
// MC 26.x 取消了混淆，使用 Mojang 官方名称，无需 Yarn mappings
def isMinecraft26x = mcVersion >= 26000

// 输出文件名
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.nucleoid.xyz/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (isMinecraft26x) {
        // 26.x: MC 取消混淆，使用空映射文件（含 official 命名空间）满足 Loom 要求
        mappings loom.layered {
            mappings file("${rootProject.projectDir}/versions/shared/empty-mappings.tiny")
        }
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    } else {
        // 1.16.5 ~ 1.21.11: 使用 Yarn mappings + modImplementation
        mappings "net.fabricmc:yarn:${project.minecraft_version}+build.${project.yarn_build}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    // 预处理器模式下 sourcesJar 重映射会失败，由主项目单独构建 sourcesJar
    // CI 统一使用 Java 25 运行 Gradle；旧版本通过 options.release 保持目标字节码，
    // 避免 fresh runner 额外寻找 Java 17/21 toolchain 导致构建失败。
}

// 预处理器子项目禁用 sourcesJar 重映射（预处理指令导致 remapper 崩溃）
// 26.x 无 mappings 时 remapSourcesJar 可能不存在，使用 matching 安全跳过
tasks.matching { it.name == 'remapSourcesJar' }.configureEach {
    enabled = false
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = 'UTF-8'
}

// 读取主项目名称
def mainProjectName = file("${rootProject.projectDir}/versions/mainProject").text.trim()

// 共享源码目录（含预处理指令）
def sharedSrcDir = file("${rootProject.projectDir}/src/main/java")
def sharedResDir = file("${rootProject.projectDir}/src/main/resources")
def versionJavaDir = file("${project.projectDir}/src/main/java")
def versionResDir = file("${project.projectDir}/src/main/resources")
def preprocessedDir = file("${buildDir}/preprocessed/main/java")
def sharedTestDir = file("${rootProject.projectDir}/src/test/java")
def stubOnlySources = (project.findProperty('stub_only_sources') ?: 'false').toString().toBoolean()
// 测试仅在主版本上编译运行（测试文件引用 Minecraft API，旧版本可能不兼容）
def isMainProject = project.name == mainProjectName

// 生成预处理代码的任务：按当前子项目 mcVersion 处理 //#if / //#else / //#endif，
// 并在选中旧版本分支时把 //$$ 代码行恢复为真实 Java 代码。
// MC 26.x 额外执行 Yarn→Mojang 名称映射转换。
abstract class PreprocessTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    def File srcDir

    @OutputDirectory
    def File outDir

    @Input
    def int targetMcVersion

    @TaskAction
    def preprocess() {
        outDir.deleteDir()
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                def relPath = srcDir.toPath().relativize(f.toPath())
                def outFile = new File(outDir, relPath.toString())
                outFile.parentFile.mkdirs()
                def lines = f.readLines('UTF-8')
                def outLines = []
                def stack = []
                lines.each { line ->
                    def trimmed = line.trim()
                    def matcher = (trimmed =~ /^\/\/#(if|else|endif)\s*(.*)/)
                    if (matcher.matches()) {
                        def directive = matcher.group(1)
                        def expr = matcher.group(2)?.trim()
                        if (directive == 'if') {
                            stack.push(evaluate(expr, targetMcVersion))
                        } else if (directive == 'else') {
                            if (stack) stack.push(!stack.pop())
                        } else if (directive == 'endif') {
                            if (stack) stack.pop()
                        }
                        return
                    }
                    boolean active = true
                    for (def s : stack) {
                        if (!s) { active = false; break }
                    }
                    if (active) {
                        String processed = uncommentPreprocessLine(line)
                        if (targetMcVersion >= 26000) {
                            processed = applyMojangMapping(processed, targetMcVersion)
                        }
                        // Pre-1.19: Text API uses constructors instead of factory methods (Text.literal introduced in 1.19)
                        if (targetMcVersion < 11900 && targetMcVersion < 26000) {
                            processed = processed.replaceAll("Text\\.literal\\(", "new LiteralText(")
                            processed = processed.replaceAll("Text\\.translatable\\(", "new TranslatableText(")
                            processed = processed.replaceAll("Text\\.empty\\(\\)", 'new LiteralText("")')
                            // Pre-1.19: Style.withObfuscated/withStrikethrough → withFormatting
                            processed = processed.replaceAll("\\.withObfuscated\\(true\\)", ".withFormatting(Formatting.OBFUSCATED)")
                            processed = processed.replaceAll("\\.withObfuscated\\(false\\)", "")
                            processed = processed.replaceAll("\\.withStrikethrough\\(true\\)", ".withFormatting(Formatting.STRIKETHROUGH)")
                            processed = processed.replaceAll("\\.withStrikethrough\\(false\\)", "")
                            // Pre-1.19: fillStyle → setStyle (fillStyle introduced in 1.19)
                            processed = processed.replaceAll("\\.fillStyle\\(", ".setStyle(")
                            // Pre-1.19: networkHandler.sendChatCommand/sendChatMessage → player.sendChatMessage
                            // (ClientPlayNetworkHandler doesn't have these in pre-1.19; PlayerEntity does)
                            processed = processed.replaceAll("client\\.player\\.networkHandler\\.sendChatCommand\\(", 'client.player.sendChatMessage("/" + ')
                            processed = processed.replaceAll("client\\.player\\.networkHandler\\.sendChatMessage\\(", "client.player.sendChatMessage(")
                            // Pre-1.19: Identifier.of() → new Identifier()
                            processed = processed.replaceAll("Identifier\\.of\\(", "new Identifier(")
                            // Pre-1.19: Formatting.getColorValue() returns Integer, use Formatting directly
                            processed = processed.replaceAll("Formatting\\.([A-Z_]+)\\.getColorValue\\(\\) != null \\? Formatting\\.\\1\\.getColorValue\\(\\) : null", 'Formatting.$1')
                        }
                        // Pre-1.20: DrawContext wrapper is in com.niuqu.chatbubble (avoids Loom excluding net.minecraft.* sources)
                        if (targetMcVersion < 12000) {
                            processed = processed.replaceAll("import net\\.minecraft\\.client\\.gui\\.DrawContext;", "import com.niuqu.chatbubble.DrawContext;")
                        }
                        if (targetMcVersion < 11700) {
                            // 1.16.5 only: setScreen → openScreen
                            processed = processed.replaceAll("client\\.setScreen\\(", "client.openScreen(")
                            processed = processed.replaceAll("MinecraftClient\\.getInstance\\(\\)\\.setScreen\\(", "MinecraftClient.getInstance().openScreen(")
                            // 1.16.5: chatKey → keyChat (field renamed in 1.17)
                            processed = processed.replaceAll("\\bchatKey\\b", "keyChat")
                            // 1.16.5: addDrawableChild → addButton (addDrawableChild introduced in 1.17)
                            processed = processed.replaceAll("\\baddDrawableChild\\(", "addButton(")
                            // 1.16.5: NativeImage(NativeImage.Format.RGBA, w, h, useLinear) → NativeImage(w, h, useLinear) (no Format enum)
                            processed = processed.replaceAll("new NativeImage\\(NativeImage\\.Format\\.RGBA, ", "new NativeImage(")
                            // 1.16.5: JsonParser.parseString(x) → new JsonParser().parse(x) (parse is instance method in older Gson)
                            processed = processed.replaceAll("JsonParser\\.parseString\\(", "new JsonParser().parse(")
                            // 1.16.5: VertexFormat.DrawMode.QUADS → 7 (GL_QUADS int, no DrawMode enum)
                            processed = processed.replaceAll("VertexFormat\\.DrawMode\\.QUADS", "7")
                            // 1.16.5: RenderSystem.setShaderTexture(0, tex) → TextureManager.bindTexture(tex)
                            processed = processed.replaceAll("RenderSystem\\.setShaderTexture\\(0, ([^)]+)\\)", 'MinecraftClient.getInstance().getTextureManager().bindTexture($1)')
                            // 1.16.5: Remove RenderSystem.setShader(GameRenderer::getPositionTexShader) - fixed-function pipeline
                            processed = processed.replaceAll("RenderSystem\\.setShader\\(GameRenderer::getPositionTexShader\\);", "// shader not needed in 1.16.5")
                            // 1.16.5: buffer.end() → Tessellator.getInstance().draw() (1.17+ split into end+draw)
                            processed = processed.replaceAll("buffer\\.end\\(\\);", "Tessellator.getInstance().draw();")
                            // 1.16.5: BufferRenderer.draw(buffer) already handled by Tessellator.draw()
                            processed = processed.replaceAll("BufferRenderer\\.draw\\(buffer\\);", "// handled by Tessellator.draw()")
                        }
                        outLines.add(processed)
                    }
                }
                // 26.x: 注入额外 import（类移动到了不同的包）
                if (targetMcVersion >= 26000) {
                    def pkgIdx = -1
                    for (int i = 0; i < outLines.size(); i++) {
                        if (outLines[i].startsWith("package ")) { pkgIdx = i; break }
                    }
                    if (pkgIdx >= 0) {
                        def content = outLines.join("\n")
                        def toAdd = []
                        if (content.contains("FormattedCharSequence") &&
                            !outLines.any { it.trim() == "import net.minecraft.util.FormattedCharSequence;" })
                            toAdd.add("import net.minecraft.util.FormattedCharSequence;")
                        if (content.contains("TranslatableContents") &&
                            !outLines.any { it.trim() == "import net.minecraft.network.chat.contents.TranslatableContents;" })
                            toAdd.add("import net.minecraft.network.chat.contents.TranslatableContents;")
                        if (toAdd) outLines.addAll(pkgIdx + 1, toAdd)
                    }
                }
                // Pre-1.19: 注入 LiteralText/TranslatableText import
                if (targetMcVersion < 11900 && targetMcVersion < 26000) {
                    def pkgIdx = -1
                    for (int i = 0; i < outLines.size(); i++) {
                        if (outLines[i].startsWith("package ")) { pkgIdx = i; break }
                    }
                    if (pkgIdx >= 0) {
                        def content = outLines.join("\n")
                        def toAdd = []
                        if (content.contains("LiteralText") &&
                            !outLines.any { it.trim() == "import net.minecraft.text.LiteralText;" })
                            toAdd.add("import net.minecraft.text.LiteralText;")
                        if (content.contains("TranslatableText") && !content.contains("TranslatableTextContent") &&
                            !outLines.any { it.trim() == "import net.minecraft.text.TranslatableText;" })
                            toAdd.add("import net.minecraft.text.TranslatableText;")
                        if (toAdd) outLines.addAll(pkgIdx + 1, toAdd)
                    }
                }
                outFile.write(outLines.join('\n'), 'UTF-8')
            }
        }
    }

    static String uncommentPreprocessLine(String line) {
        def matcher = (line =~ /^(\s*)\/\/\$\$ ?(.*)$/)
        return matcher.matches() ? matcher.group(1) + matcher.group(2) : line
    }

    static boolean evaluate(String expr, int ver) {
        def m = (expr =~ /^\s*MC\s*(>=|<=|==|!=|<|>)\s*(\d+)\s*$/)
        if (m.matches()) {
            def op = m.group(1)
            def val = Integer.parseInt(m.group(2))
            switch (op) {
                case '>=': return ver >= val
                case '<=': return ver <= val
                case '==': return ver == val
                case '!=': return ver != val
                case '<':  return ver < val
                case '>':  return ver > val
            }
        }
        return true
    }

    // Yarn→Mojang 26.x 名称映射 (MC 26.x 取消混淆，使用 Mojang 官方名称)
    static String applyMojangMapping(String line, int targetMcVersion) {
        boolean is26_2 = targetMcVersion >= 260200

        // Step 1: FQN-specific mappings (must come before package replacements)
        line = line.replaceAll("net\\.minecraft\\.util\\.Identifier\\b", "net.minecraft.resources.Identifier")
        line = line.replaceAll("net\\.minecraft\\.util\\.Formatting\\b", "net.minecraft.ChatFormatting")
        line = line.replaceAll("net\\.minecraft\\.util\\.Language\\b", "net.minecraft.locale.Language")
        line = line.replaceAll("net\\.minecraft\\.util\\.Rect2i\\b", "net.minecraft.client.renderer.Rect2i")
        line = line.replaceAll("net\\.minecraft\\.client\\.util\\.math\\.Rect2i\\b", "net.minecraft.client.renderer.Rect2i")
        line = line.replaceAll("net\\.minecraft\\.text\\.OrderedText\\b", "net.minecraft.util.FormattedCharSequence")
        line = line.replaceAll("net\\.minecraft\\.text\\.TextCodecs\\b", "net.minecraft.network.chat.ComponentSerialization")
        line = line.replaceAll("net\\.minecraft\\.text\\.TranslatableTextContent\\b", "net.minecraft.network.chat.contents.TranslatableContents")
        line = line.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\b", "net.minecraft.network.chat.CommonComponents")
        line = line.replaceAll("net\\.minecraft\\.registry\\.entry\\.RegistryEntry\\b", "net.minecraft.core.Holder")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.DrawContext\\b", "net.minecraft.client.gui.GuiGraphicsExtractor")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.Click\\b", "net.minecraft.client.input.MouseButtonEvent")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.Element\\b", "net.minecraft.client.gui.components.events.GuiEventListener")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.PlayerSkinDrawer\\b", "net.minecraft.client.gui.components.PlayerFaceExtractor")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.screen\\.ChatInputSuggestor\\b", "net.minecraft.client.gui.components.CommandSuggestions")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.screen\\.SleepingChatScreen\\b", "net.minecraft.client.gui.screens.InBedChatScreen")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.hud\\.ChatHud\\b", "net.minecraft.client.gui.components.ChatComponent")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.hud\\.MessageIndicator\\b", "net.minecraft.client.gui.components.MessageIndicator")
        line = line.replaceAll("net\\.minecraft\\.client\\.texture\\.NativeImage\\b", "com.mojang.blaze3d.platform.NativeImage")
        line = line.replaceAll("net\\.minecraft\\.client\\.sound\\.PositionedSoundInstance\\b", "net.minecraft.client.resources.sounds.SimpleSoundInstance")
        line = line.replaceAll("net\\.minecraft\\.client\\.util\\.DefaultSkinHelper\\b", "net.minecraft.client.resources.DefaultPlayerSkin")
        line = line.replaceAll("net\\.minecraft\\.client\\.input\\.MouseInput\\b", "net.minecraft.client.input.MouseButtonInfo")
        line = line.replaceAll("net\\.minecraft\\.entity\\.player\\.SkinTextures\\b", "net.minecraft.world.entity.player.PlayerSkin")
        line = line.replaceAll("net\\.minecraft\\.network\\.packet\\.CustomPayload\\b", "net.minecraft.network.protocol.common.custom.CustomPacketPayload")
        line = line.replaceAll("net\\.minecraft\\.network\\.message\\.MessageType\\b", "net.minecraft.network.chat.ChatType")
        line = line.replaceAll("net\\.minecraft\\.network\\.message\\.SignedMessage\\b", "net.minecraft.network.chat.PlayerChatMessage")
        line = line.replaceAll("net\\.minecraft\\.network\\.message\\.MessageSignatureData\\b", "net.minecraft.network.chat.MessageSignature")
        line = line.replaceAll("net\\.minecraft\\.resource\\.ResourceType\\b", "net.minecraft.server.packs.PackType")
        line = line.replaceAll("net\\.minecraft\\.server\\.command\\.ServerCommandSource\\b", "net.minecraft.commands.CommandSourceStack")
        line = line.replaceAll("net\\.minecraft\\.server\\.command\\.CommandManager\\b", "net.minecraft.commands.Commands")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.Drawable\\b", "net.minecraft.client.gui.components.Renderable")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.Selectable\\b", "net.minecraft.client.gui.narration.NarratableEntry")
        line = line.replaceAll("net\\.minecraft\\.client\\.multiplayer\\.message\\b", "net.minecraft.client.multiplayer.chat")
        line = line.replaceAll("net\\.minecraft\\.util\\.WorldSavePath\\b", "net.minecraft.world.level.storage.LevelResource")
        line = line.replaceAll("net\\.minecraft\\.client\\.network\\.message\\b", "net.minecraft.client.multiplayer.chat")
        line = line.replaceAll("net\\.minecraft\\.client\\.sound\\.SimpleSoundInstance\\b", "net.minecraft.client.resources.sounds.SimpleSoundInstance")
        line = line.replaceAll("net\\.minecraft\\.registry\\.RegistryWrapper\\.WrapperLookup\\b", "net.minecraft.core.HolderLookup.Provider")
        line = line.replaceAll("net\\.minecraft\\.registry\\.RegistryWrapper\\.Impl\\b", "net.minecraft.core.HolderLookup.RegistryLookup")
        line = line.replaceAll("net\\.minecraft\\.registry\\.RegistryWrapper\\b", "net.minecraft.core.HolderLookup")
        line = line.replaceAll("net\\.minecraft\\.registry\\.RegistryKey\\b", "net.minecraft.resources.ResourceKey")
        line = line.replaceAll("net\\.minecraft\\.registry\\.RegistryOps\\b", "net.minecraft.resources.RegistryOps")
        line = line.replaceAll("net\\.minecraft\\.registry\\.BuiltinRegistries\\b", "net.minecraft.core.registries.BuiltInRegistries")
        line = line.replaceAll("net\\.minecraft\\.client\\.render\\.RenderLayer\\b", "net.minecraft.client.renderer.rendertype.RenderType")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.navigation\\.GuiNavigationPath\\b", "net.minecraft.client.gui.ComponentPath")
        // 26.x: InputUtil moved to blaze3d package
        line = line.replaceAll("net\\.minecraft\\.client\\.util\\.InputUtil\\b", "com.mojang.blaze3d.platform.InputConstants")
        // 26.x: HoveredTooltipPositioner package moved
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.tooltip\\.", "net.minecraft.client.gui.screens.inventory.tooltip.")

        // Step 2: Package name replacements (longest first to avoid partial matches)
        line = line.replace("net.minecraft.network.packet.c2s.play", "net.minecraft.network.protocol.game")
        line = line.replace("net.minecraft.network.packet.c2s", "net.minecraft.network.protocol")
        line = line.replace("net.minecraft.network.packet.s2c", "net.minecraft.network.protocol")
        line = line.replace("net.minecraft.network.packet", "net.minecraft.network.protocol.common")
        line = line.replace("net.minecraft.network.message", "net.minecraft.network.chat")
        line = line.replace("net.minecraft.client.gui.widget", "net.minecraft.client.gui.components")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.screen\\b", "net.minecraft.client.gui.screens")
        line = line.replace("net.minecraft.client.gui.hud", "net.minecraft.client.gui.components")
        line = line.replace("net.minecraft.entity.player", "net.minecraft.world.entity.player")
        line = line.replace("net.minecraft.server.network", "net.minecraft.server.level")
        line = line.replaceAll("net\\.minecraft\\.server\\.command\\b", "net.minecraft.server.commands")
        line = line.replaceAll("net\\.minecraft\\.client\\.render\\b", "net.minecraft.client.renderer")
        line = line.replace("net.minecraft.client.texture", "net.minecraft.client.renderer.texture")
        line = line.replace("net.minecraft.client.network", "net.minecraft.client.multiplayer")
        line = line.replaceAll("net\\.minecraft\\.client\\.sound\\b", "net.minecraft.client.sounds")
        line = line.replace("net.minecraft.client.gl", "net.minecraft.client.renderer")
        line = line.replace("net.minecraft.client.font", "net.minecraft.client.gui")
        line = line.replace("net.minecraft.client.util.math", "net.minecraft.util")
        line = line.replace("net.minecraft.client.util", "net.minecraft.client")
        line = line.replace("net.minecraft.util.math", "net.minecraft.util")
        line = line.replace("net.minecraft.resource.", "net.minecraft.server.packs.resources.")
        line = line.replaceAll("net\\.minecraft\\.command\\b", "net.minecraft.commands")
        line = line.replace("net.minecraft.entity", "net.minecraft.world.entity")
        line = line.replaceAll("net\\.minecraft\\.sound\\b", "net.minecraft.sounds")
        line = line.replace("net.minecraft.block", "net.minecraft.world.level.block")
        line = line.replace("net.minecraft.item", "net.minecraft.world.item")
        line = line.replace("net.minecraft.text", "net.minecraft.network.chat")
        line = line.replace("net.minecraft.registry", "net.minecraft.core")

        // Step 3: Field name replacements (BEFORE method names so we can use context patterns)
        // Skip on import/package lines to avoid corrupting package paths
        if (!line.trim().startsWith("import ") && !line.trim().startsWith("package ")) {
            line = line.replaceAll("\\btextRenderer\\b", "font")
            line = line.replaceAll("\\bcurrentScreen\\b", "screen")
            line = line.replaceAll("\\brunDirectory\\b", "gameDirectory")
            line = line.replaceAll("\\bnetworkHandler\\b", "connection")
            line = line.replaceAll("\\bgetWorld\\b", "getLevel")
            line = line.replaceAll("(?<!net\\.minecraft)\\.world\\b", ".level")
            line = line.replaceAll("\\bthis\\.client\\b", "this.minecraft")
            line = line.replaceAll("(?<![.\\-/])\\bclient\\b(?!\\()", "minecraft")
            line = line.replaceAll("\\.mouse\\b", ".mouseHandler")
            line = line.replaceAll("\\.keyboard\\b", ".keyboardHandler")
            line = line.replaceAll("\\bchatKey\\b", "keyChat")
            // 26.2: Minecraft.screen 字段迁移到 Gui.screen() 方法
            if (is26_2) {
                line = line.replaceAll("\\b(MinecraftClient\\.getInstance\\(\\)|Minecraft\\.getInstance\\(\\)|minecraft|mc|this\\.minecraft)\\.screen\\b", "\$1.gui.screen()")
            }
        }

        // Step 4: Method name replacements (after field mapping so context patterns work)
        line = line.replaceAll("\\bdrawText\\b", "text")
        line = line.replaceAll("\\bdrawCenteredText\\b", "centeredText")
        line = line.replaceAll("\\bdrawTexture\\b", "blit")
        line = line.replaceAll("\\bdrawTooltip\\b", "setTooltipForNextFrame")
        line = line.replaceAll("\\bgetMatrices\\b", "pose")
        line = line.replaceAll("\\bcreateNewRootLayer\\b", "nextStratum")
        line = line.replaceAll("\\bmatchesKey\\b", "matches")
        line = line.replaceAll("\\bgetBoundKeyLocalizedText\\b", "getTranslatedKeyMessage")
        line = line.replaceAll("\\bsendChatMessage\\b", "sendChat")
        line = line.replaceAll("\\bsendChatCommand\\b", "sendCommand")
        line = line.replaceAll("\\bdimensions\\b", "bounds")
        line = line.replaceAll("\\bwrapLines\\b", "split")
        line = line.replaceAll("\\bfontHeight\\b", "lineHeight")
        line = line.replaceAll("\\bgetSkinTextures\\b", "getSkin")
