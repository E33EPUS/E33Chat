        // 26.2: Gui.getChat() 迁移到 Hud.getChat()
        if (is26_2) {
            line = line.replaceAll("\\.gui\\.getChat\\(\\)", ".gui.hud.getChat()")
            // 26.2: Minecraft.setScreen() 迁移到 Gui.setScreen() (minecraft 变量名)
            line = line.replaceAll("minecraft\\.setScreen\\(", "minecraft.gui.setScreen(")
        }
        line = line.replaceAll("\\bwithUnderline\\b", "withUnderlined")
        line = line.replaceAll("\\btuple\\b", "of")
        line = line.replaceAll("\\bregisterTexture\\b", "register")
        // 26.x: setColorArgb → setPixelRGBA → setPixelABGR (两步转换)
        line = line.replaceAll("\\bsetColorArgb\\b", "setPixelRGBA")
        line = line.replaceAll("\\bgetSavePath\\b", "getWorldPath")
        line = line.replaceAll("getPlayerList\\(\\)\\.getOnlinePlayers", "getPlayerList().getPlayers")
        line = line.replaceAll("\\bgetContent\\b", "getContents")
        line = line.replaceAll("mouseHandler\\.getX\\(\\)", "mouseHandler.xpos()")
        line = line.replaceAll("mouseHandler\\.getY\\(\\)", "mouseHandler.ypos()")
        line = line.replaceAll("\\bgetScaleFactor\\b", "getGuiScale")
        line = line.replaceAll("\\.getWindow\\(\\)\\.getWindow\\(\\)", ".getWindow().handle()")
        line = line.replaceAll("\\bgetOperatingSystem\\b", "getPlatform")
        // 26.x: Util.OS.open() → openUri() (方法重命名，适用于所有 26.x)
        line = line.replaceAll("getPlatform\\(\\)\\.open\\(", "getPlatform().openUri(")
        line = line.replaceAll("chatField\\.write\\(", "chatField.insertText(")
        // 26.x: ChatScreen.chatField → ChatScreen.input (field rename)
        line = line.replaceAll("\\bchatField\\b", "input")
        // 26.x: TextureManager.destroyTexture → release, DefaultPlayerSkin.getTexture → getDefaultTexture
        line = line.replaceAll("\\bdestroyTexture\\b", "release")
        line = line.replaceAll("\\bgetTexture\\(\\)", "getDefaultTexture()")
        // 26.x: HoverEvent.getAction → action (interface method)
        line = line.replaceAll("\\bgetAction\\b", "action")
        // 26.x: RegistryOps.of → RegistryOps.create
        line = line.replaceAll("RegistryOps\\.of\\(", "RegistryOps.create(")
        // 26.x: Screen.handleClickEvent → defaultHandleClickEvent
        line = line.replaceAll("\\bhandleClickEvent\\b", "defaultHandleClickEvent")
        // 26.x: ChatScreen.setChatFromHistory → moveInHistory
        line = line.replaceAll("\\bsetChatFromHistory\\b", "moveInHistory")
        // 26.x: Screen.onFilesDropped → onFilesDrop (no trailing 'd')
        line = line.replaceAll("\\bonFilesDropped\\b", "onFilesDrop")
        // 26.x: InputConstants.GLFW_MOD_SHIFT → MOD_SHIFT (prefix dropped)
        line = line.replaceAll("\\bGLFW_MOD_SHIFT\\b", "MOD_SHIFT")
        // 26.x: FormattedText.concat → composite (method renamed)
        line = line.replaceAll("FormattedText\\.concat\\b", "FormattedText.composite")
        line = line.replaceAll("Language\\.getInstance\\(\\)\\.reorder\\b", "Language.getInstance().getVisualOrder")
        line = line.replaceAll("\\bsetWindowActive\\b", "setAllowSuggestions")
        line = line.replaceAll("\\brefresh\\b", "updateCommandInfo")
        line = line.replaceAll("\\bIdentifier\\.of\\b", "Identifier.fromNamespaceAndPath")
        line = line.replaceAll("\\bhasPermissions\\b", "hasPermission")
        line = line.replaceAll("\\bsendMessage\\b", "sendSystemMessage")
        line = line.replaceAll("\\bgetDisplayName\\b", "getTabListDisplayName")
        line = line.replaceAll("\\bsetUneditableColor\\b", "setTextColorUneditable")
        line = line.replaceAll("\\bshouldPause\\b", "isPauseScreen")
        line = line.replaceAll("\\brenderBackground\\b", "extractBackground")
        line = line.replaceAll("\\bpublic void close\\(\\)", "public void onClose()")
        line = line.replaceAll("\\bdrawHoverEvent\\b", "setTooltipForNextFrame")
        line = line.replaceAll("\\bonChatMessage\\b", "handlePlayerChatMessage")
        line = line.replaceAll("\\bonProfilelessMessage\\b", "handleDisguisedChatMessage")
        line = line.replaceAll("\\bonGameMessage\\b", "handleSystemMessage")
        line = line.replaceAll("\\bplayC2S\\b", "serverboundPlay")
        line = line.replaceAll("\\bplayS2C\\b", "clientboundPlay")
        line = line.replaceAll("\\bBLOCK_NOTE_BLOCK_CHIME\\b", "NOTE_BLOCK_CHIME")
        line = line.replaceAll("\\bBLOCK_NOTE_BLOCK_PLING\\b", "NOTE_BLOCK_PLING")
        // Widget render → extractRenderState (26.x rendering refactor)
        line = line.replaceAll("super\\.render\\(", "super.extractRenderState(")
        line = line.replaceAll("(\\b\\w+)\\.render\\(g,", "\$1.extractRenderState(g,")
        // Undo render→extractRenderState for custom render methods (not Renderable interface)
        line = line.replaceAll("INSTANCE\\.extractRenderState\\(g,", "INSTANCE.render(g,")
        line = line.replaceAll("searchPanel\\.extractRenderState\\(", "searchPanel.render(")
        line = line.replaceAll("settingsMenu\\.extractRenderState\\(", "settingsMenu.render(")
        line = line.replaceAll("emojiPanel\\.extractRenderState\\(", "emojiPanel.render(")
        line = line.replaceAll("quickChatPanel\\.extractRenderState\\(", "quickChatPanel.render(")
        // ChatComponent methods
        line = line.replaceAll("\\bgetMessageHistory\\b", "getRecentChat")
        line = line.replaceAll("\\baddToMessageHistory\\b", "addRecentChat")
        line = line.replaceAll("getChat\\(\\)\\.reset\\(\\)", "getChat().clearMessages(true)")
        // CommandSourceStack methods
        line = line.replaceAll("\\bsendError\\b", "sendFailure")
        line = line.replaceAll("\\bsendFeedback\\b", "sendSuccess")
        // PlayerSkinDrawer.draw → PlayerFaceExtractor.extractRenderState
        line = line.replaceAll("PlayerSkinDrawer\\.draw\\b", "PlayerFaceExtractor.extractRenderState")
        // Additional Mojang method name mappings
        line = line.replaceAll("\\bgetColorValue\\b", "getColor")
        line = line.replaceAll("\\baddDrawableChild\\b", "addRenderableWidget")
        line = line.replaceAll("\\baddSelectableChild\\b", "addWidget")
        line = line.replaceAll("\\bgetScoreboardTeam\\b", "getTeam")
        line = line.replaceAll("\\bgetRegistryManager\\b", "registryAccess")
        line = line.replaceAll("\\bcreateWrapperLookup\\b", "createAccess")
        line = line.replaceAll("\\bstreamAllRegistryKeys\\b", "listRegistryKeys")
        line = line.replaceAll("\\bgetOptional\\b", "lookup")
        // Navigation system mappings (26.x: GuiNavigation → FocusNavigationEvent)
        line = line.replaceAll("\\bgetNavigationPath\\b", "nextFocusPath")
        line = line.replaceAll("\\bswitchFocus\\b", "changeFocus")
        line = line.replaceAll("\\bblur\\(\\)", "clearFocus()")
        // Simplify withColor ternary: ChatFormatting.X.getColor() != null ? ChatFormatting.X.getColor() : null → ChatFormatting.X.getColor()
        line = line.replaceAll("ChatFormatting\\.(\\w+)\\.getColor\\(\\) != null \\? ChatFormatting\\.\\1\\.getColor\\(\\) : null", "ChatFormatting.\$1.getColor()")
        // Style.withFormatting → applyFormat
        line = line.replaceAll("\\bwithFormatting\\b", "applyFormat")
        // Resource.getInputStream → open
        line = line.replaceAll("\\bgetInputStream\\b", "open")
        // ChatType.Bound.type() → chatType()
        line = line.replaceAll("\\bparams\\.type\\(\\)", "params.chatType()")
        // setPixelRGBA → setPixelABGR (NativeImage ARGB→ABGR format change)
        line = line.replaceAll("\\bsetPixelRGBA\\b", "setPixelABGR")

        // Step 5: Class name replacements (word-boundary regex, longest names first)
        line = line.replaceAll("\\bRegistryWrapper\\.WrapperLookup\\b", "HolderLookup.Provider")
        line = line.replaceAll("\\bRegistryWrapper\\.Impl\\b", "HolderLookup.RegistryLookup")
        line = line.replaceAll("\\bRegistryWrapper\\b", "HolderLookup")
        line = line.replaceAll("\\bRegistryKey\\b", "ResourceKey")
        line = line.replaceAll("\\bRenderLayer\\b", "RenderType")
        line = line.replaceAll("\\bBuiltinRegistries\\b", "BuiltInRegistries")
        line = line.replaceAll("\\bGuiNavigation\\.Tab\\b", "FocusNavigationEvent.TabNavigation")
        line = line.replaceAll("\\bGuiNavigation\\.Arrow\\b", "FocusNavigationEvent.ArrowNavigation")
        line = line.replaceAll("\\bGuiNavigation\\b", "FocusNavigationEvent")
        line = line.replaceAll("\\bNavigationDirection\\b", "ScreenDirection")
        line = line.replaceAll("\\bGuiNavigationPath\\b", "ComponentPath")
        line = line.replaceAll("\\bNativeImageBackedTexture\\b", "DynamicTexture")
        line = line.replaceAll("\\bServerPlayerEntity\\b", "ServerPlayer")
        line = line.replaceAll("\\bPlayerEntity\\b", "Player")
        line = line.replaceAll("\\bPlayerListEntry\\b", "PlayerInfo")
        line = line.replaceAll("\\bClientPlayNetworkHandler\\b", "ClientPacketListener")
        line = line.replaceAll("\\bPositionedSoundInstance\\b", "SimpleSoundInstance")
        line = line.replaceAll("\\bPacketByteBuf\\b", "FriendlyByteBuf")
        line = line.replaceAll("\\bPacketCodec\\b", "StreamCodec")
        line = line.replaceAll("\\bMinecraftClient\\b", "Minecraft")
        line = line.replaceAll("\\bMathHelper\\b", "Mth")
        line = line.replaceAll("\\bDrawContext\\b", "GuiGraphicsExtractor")
        line = line.replaceAll("\\bButtonWidget\\b", "Button")
        line = line.replaceAll("\\bTextFieldWidget\\b", "EditBox")
        line = line.replaceAll("\\bClickableWidget\\b", "AbstractWidget")
        line = line.replaceAll("\\bSliderWidget\\b", "AbstractSliderButton")
        line = line.replaceAll("\\bMutableText\\b", "MutableComponent")
        line = line.replaceAll("\\bOrderedText\\b", "FormattedCharSequence")
        line = line.replaceAll("\\bTextCodecs\\b", "ComponentSerialization")
        line = line.replaceAll("\\bTranslatableTextContent\\b", "TranslatableContents")
        line = line.replaceAll("\\bTextRenderer\\b", "Font")
        line = line.replaceAll("\\bFormatting\\b", "ChatFormatting")
        line = line.replaceAll("\\bDefaultSkinHelper\\b", "DefaultPlayerSkin")
        line = line.replaceAll("\\bPlayerSkinDrawer\\b", "PlayerFaceExtractor")
        line = line.replaceAll("\\bSkinTextures\\b", "PlayerSkin")
        line = line.replaceAll("\\bServerCommandSource\\b", "CommandSourceStack")
        line = line.replaceAll("\\bChatHud\\b", "ChatComponent")
        line = line.replaceAll("\\bChatInputSuggestor\\b", "CommandSuggestions")
