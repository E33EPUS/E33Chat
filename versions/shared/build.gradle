// 共享构建脚本 - 所有版本子项目共用 (MasaGadget 风格)
// 版本特定配置在各自 gradle.properties 中定义

// 使用 buildscript + apply plugin 方式支持动态 Loom 版本
buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://jitpack.io" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("net.fabricmc:fabric-loom:${project.loom_version}")
        classpath("com.github.Fallen-Breath:preprocessor:4c38783")
    }
}



println "Buildscript classpath:"
buildscript.configurations.classpath.each { f ->
    if (f.name.contains("mapping-io") || f.name.contains("fabric-loom")) {
        println "  ${f.name}"
    }
}

apply plugin: "java"
apply plugin: "fabric-loom"
apply plugin: "com.replaymod.preprocess"
apply plugin: "maven-publish"

// 从 root gradle.properties 设置 group 和 version
group = rootProject.maven_group
version = rootProject.mod_version

// 使用 project properties 直接配置 (MasaGadget 风格)
println "Building: ${project.name} (MC ${project.minecraft_version}) - loom ${project.loom_version}"
def targetJavaVersion = (project.findProperty('java_version') ?: '21') as Integer
def modmenuVersion = project.findProperty('modmenu_version') ?: '11.0.3'

// 设置预处理器 MC 版本变量
final int mcVersion = project.mcVersion
preprocess {
    vars.put("MC", mcVersion)
}

// 输出文件名
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.nucleoid.xyz/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.${project.yarn_build}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    // 预处理器模式下 sourcesJar 重映射会失败，由主项目单独构建 sourcesJar
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

// 预处理器子项目禁用 sourcesJar 重映射（预处理指令导致 remapper 崩溃）
tasks.named('remapSourcesJar').configure {
    enabled = false
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = 'UTF-8'
}

// 读取主项目名称
def mainProjectName = file("${rootProject.projectDir}/versions/mainProject").text.trim()

// 共享源码目录（含预处理指令）
def sharedSrcDir = file("${rootProject.projectDir}/src/main/java")
def sharedResDir = file("${rootProject.projectDir}/src/main/resources")
def versionJavaDir = file("${project.projectDir}/src/main/java")
def versionResDir = file("${project.projectDir}/src/main/resources")
def preprocessedDir = file("${buildDir}/preprocessed/main/java")
def sharedTestDir = file("${rootProject.projectDir}/src/test/java")
def stubOnlySources = (project.findProperty('stub_only_sources') ?: 'false').toString().toBoolean()
// 测试仅在主版本上编译运行（测试文件引用 Minecraft API，旧版本可能不兼容）
def isMainProject = project.name == mainProjectName

// 生成预处理代码的任务：按当前子项目 mcVersion 处理 //#if / //#else / //#endif，
// 并在选中旧版本分支时把 //$$ 代码行恢复为真实 Java 代码。
abstract class PreprocessTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    def File srcDir

    @OutputDirectory
    def File outDir

    @Input
    def int targetMcVersion

    @TaskAction
    def preprocess() {
        outDir.deleteDir()
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                def relPath = srcDir.toPath().relativize(f.toPath())
                def outFile = new File(outDir, relPath.toString())
                outFile.parentFile.mkdirs()
                def lines = f.readLines('UTF-8')
                def outLines = []
                def stack = []
                lines.each { line ->
                    def trimmed = line.trim()
                    def matcher = (trimmed =~ /^\/\/#(if|else|endif)\s*(.*)/)
                    if (matcher.matches()) {
                        def directive = matcher.group(1)
                        def expr = matcher.group(2)?.trim()
                        if (directive == 'if') {
                            stack.push(evaluate(expr, targetMcVersion))
                        } else if (directive == 'else') {
                            if (stack) stack.push(!stack.pop())
                        } else if (directive == 'endif') {
                            if (stack) stack.pop()
                        }
                        return
                    }
                    boolean active = true
                    for (def s : stack) {
                        if (!s) { active = false; break }
                    }
                    if (active) {
                        outLines.add(uncommentPreprocessLine(line))
                    }
                }
                outFile.write(outLines.join('\n'), 'UTF-8')
            }
        }
    }

    static String uncommentPreprocessLine(String line) {
        def matcher = (line =~ /^(\s*)\/\/\$\$ ?(.*)$/)
        return matcher.matches() ? matcher.group(1) + matcher.group(2) : line
    }

    static boolean evaluate(String expr, int ver) {
        def m = (expr =~ /^\s*MC\s*(>=|<=|==|!=|<|>)\s*(\d+)\s*$/)
        if (m.matches()) {
            def op = m.group(1)
            def val = Integer.parseInt(m.group(2))
            switch (op) {
                case '>=': return ver >= val
                case '<=': return ver <= val
                case '==': return ver == val
                case '!=': return ver != val
                case '<':  return ver < val
                case '>':  return ver > val
            }
        }
        return true
    }
}

def preprocessTask = tasks.register('preprocessJava', PreprocessTask) {
    srcDir = sharedSrcDir
    outDir = preprocessedDir
    targetMcVersion = project.mcVersion
}

sourceSets {
    main {
        java {
            setSrcDirs([])
            if (!stubOnlySources) {
                srcDir(preprocessedDir)
            }
            srcDir(versionJavaDir)
        }
        resources {
            setSrcDirs([])
            // 版本资源必须优先进入 jar，尤其是 fabric.mod.json；
            // 根目录资源作为共享补充，重复项由 duplicatesStrategy 处理。
            srcDir versionResDir
            srcDir sharedResDir
        }
    }
    test {
        java {
            setSrcDirs([])
        }
    }
}

tasks.named('compileJava').configure {
    if (!stubOnlySources) {
        dependsOn(preprocessTask)
    }
}

tasks.named('compileTestJava').configure {
    enabled = false
}

tasks.withType(Test).configureEach {
    enabled = false
}

// 本项目已经使用自定义 preprocessJava 处理 Java 源码，并通过 sourceSets 合并资源；
// 禁用 replaymod 插件自动预处理任务，避免资源重复写入 build/preprocessed 导致冲突。
tasks.matching { it.name == 'preprocessCode' || it.name == 'preprocessResources' }.configureEach {
    enabled = false
}



publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
