        line = line.replaceAll("\\bMessageType\\b", "ChatType")
        line = line.replaceAll("\\bSignedMessage\\b", "PlayerChatMessage")
        line = line.replaceAll("\\bMessageSignatureData\\b", "MessageSignature")
        line = line.replaceAll("\\bClientCommandC2SPacket\\b", "ServerboundClientCommandPacket")
        line = line.replaceAll("\\bRegistryEntryList\\b", "HolderSet")
        line = line.replaceAll("\\bRegistryEntry\\b", "Holder")
        line = line.replaceAll("\\bKeyBinding\\b", "KeyMapping")
        line = line.replaceAll("\\bKeyInput\\b", "KeyEvent")
        line = line.replaceAll("\\bMouseInput\\b", "MouseButtonInfo")
        line = line.replaceAll("\\bStringVisitable\\b", "FormattedText")
        line = line.replaceAll("\\bWorldSavePath\\b", "LevelResource")
        line = line.replaceAll("\\bMatrixStack\\b", "PoseStack")
        line = line.replaceAll("\\bVertexConsumerProvider\\b", "MultiBufferSource")
        line = line.replaceAll("\\bImmediateRender\\b", "MultiBufferSource.BufferSource")
        line = line.replaceAll("\\bCustomPayload\\b", "CustomPacketPayload")
        line = line.replaceAll("\\bScreenTexts\\b", "CommonComponents")
        line = line.replaceAll("\\bPressAction\\b", "OnPress")
        line = line.replaceAll("\\bResourceType\\b", "PackType")
        line = line.replaceAll("\\bElement\\b", "GuiEventListener")
        line = line.replaceAll("\\bDrawable\\b", "Renderable")
        line = line.replaceAll("\\bSelectable\\b", "NarratableEntry")
        line = line.replaceAll("\\bClick\\b", "MouseButtonEvent")
        line = line.replaceAll("\\bInputUtil\\b", "InputConstants")
        line = line.replaceAll("\\bHoveredTooltipPositioner\\b", "DefaultTooltipPositioner")
        // Standalone Text must come last (after all *Text and Text* names)
        line = line.replaceAll("\\bText\\b", "Component")

        // Step 5b: Post-class-name method mappings (need Mojang class names from Step 5)
        line = line.replaceAll("FormattedText\\.plain\\b", "FormattedText.of")
        line = line.replaceAll("FormattedText\\.concat\\b", "FormattedText.composite")
        line = line.replaceAll("DefaultPlayerSkin\\.getSkin\\b", "DefaultPlayerSkin.get")
        line = line.replaceAll("CommonComponents\\.DONE\\b", "CommonComponents.GUI_DONE")
        line = line.replaceAll("CommonComponents\\.ON\\b", "CommonComponents.OPTION_ON")
        line = line.replaceAll("CommonComponents\\.OFF\\b", "CommonComponents.OPTION_OFF")

        // Step 5c: 26.2 post-mapping fixes (must run after Formatting→ChatFormatting and getColorValue→getColor)
        if (is26_2) {
            // 26.2: Minecraft.getInstance().setScreen() → Minecraft.getInstance().gui.setScreen()
            line = line.replaceAll("Minecraft\\.getInstance\\(\\)\\.setScreen\\(", "Minecraft.getInstance().gui.setScreen(")
            // 26.2: ChatFormatting.getColor() removed — replace ternary with ChatFormatting enum directly
            line = line.replaceAll("ChatFormatting\\.([A-Z_]+)\\.getColor\\(\\) != null \\? ChatFormatting\\.\\1\\.getColor\\(\\) : null", 'ChatFormatting.$1')
        }

        // Step 6: Registry static reference + inner class mappings
        line = line.replaceAll("\\bRegistry\\.", "BuiltInRegistries.")
        line = line.replaceAll("CustomPacketPayload\\.Id\\b", "CustomPacketPayload.Type")
        line = line.replaceAll("\\bId<", "Type<")
        line = line.replaceAll("ChatType\\.Parameters\\b", "ChatType.Bound")
        line = line.replaceAll("ServerboundClientCommandPacket\\.Mode\\b", "ServerboundClientCommandPacket.Action")

        // Step 7: Fix JNI-style method descriptors (slash-separated paths in @Inject/@Invoker strings)
        line = line.replaceAll("net/minecraft/text/", "net/minecraft/network/chat/")
        line = line.replaceAll("net/minecraft/network/message/", "net/minecraft/network/chat/")
        line = line.replaceAll("net/minecraft/client/gui/hud/", "net/minecraft/client/gui/components/")
        line = line.replaceAll("net/minecraft/client/multiplayer/message/", "net/minecraft/client/multiplayer/chat/")

        return line
    }
}

def preprocessTask = tasks.register('preprocessJava', PreprocessTask) {
    srcDir = sharedSrcDir
    outDir = preprocessedDir
    targetMcVersion = mcVersion
}

sourceSets {
    main {
        java {
            setSrcDirs([])
            if (!stubOnlySources) {
                srcDir(preprocessedDir)
            }
            srcDir(versionJavaDir)
        }
        resources {
            setSrcDirs([])
            // 版本资源必须优先进入 jar，尤其是 fabric.mod.json；
            // 根目录资源作为共享补充，重复项由 duplicatesStrategy 处理。
            srcDir versionResDir
            srcDir sharedResDir
        }
    }
    test {
        java {
            setSrcDirs([])
        }
    }
}

tasks.named('compileJava').configure {
    if (!stubOnlySources) {
        dependsOn(preprocessTask)
    }
}

tasks.named('compileTestJava').configure {
    enabled = false
}

tasks.withType(Test).configureEach {
    enabled = false
}

// 本项目已经使用自定义 preprocessJava 处理 Java 源码，并通过 sourceSets 合并资源；
// 禁用 replaymod 插件自动预处理任务，避免资源重复写入 build/preprocessed 导致冲突。
tasks.matching { it.name == 'preprocessCode' || it.name == 'preprocessResources' }.configureEach {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
