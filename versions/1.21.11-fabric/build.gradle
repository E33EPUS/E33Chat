// v1_21_11 专用构建脚本 - 使用 Loom 1.13.3 + 自定义预处理任务

buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://jitpack.io" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("net.fabricmc:fabric-loom:${project.loom_version}")
    }
}

println "Building: ${project.name} (MC ${project.minecraft_version}) - loom ${project.loom_version} (with custom preprocessor)"

apply plugin: "java"
apply plugin: "fabric-loom"
apply plugin: "maven-publish"

group = rootProject.maven_group
version = rootProject.mod_version

base.archivesName = project.archives_base_name

final int mcVersion = project.mcVersion

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.${project.yarn_build}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.findProperty('modmenu_version') ?: '17.0.0'}"
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.named('remapSourcesJar').configure {
    enabled = false
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

def sharedSrcDir = file("${rootProject.projectDir}/src/main/java")
def sharedResDir = file("${rootProject.projectDir}/src/main/resources")
def versionResDir = file("${project.projectDir}/src/main/resources")
def preprocessedDir = file("${buildDir}/preprocessed/main/java")

// 生成预处理代码的任务
abstract class PreprocessTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    def File srcDir

    @OutputDirectory
    def File outDir

    @Input
    def int targetMcVersion

    @TaskAction
    def preprocess() {
        outDir.deleteDir()
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                def relPath = srcDir.toPath().relativize(f.toPath())
                def outFile = new File(outDir, relPath.toString())
                outFile.parentFile.mkdirs()
                def lines = f.readLines('UTF-8')
                def outLines = []
                def stack = []
                lines.each { line ->
                    def trimmed = line.trim()
                    def matcher = (trimmed =~ /^\/\/#(if|else|endif)\s*(.*)/)
                    if (matcher.matches()) {
                        def directive = matcher.group(1)
                        def expr = matcher.group(2)?.trim()
                        if (directive == 'if') {
                            def result = evaluate(expr, targetMcVersion)
                            stack.push(result)
                        } else if (directive == 'else') {
                            if (stack) {
                                def top = stack.pop()
                                stack.push(!top)
                            }
                        } else if (directive == 'endif') {
                            if (stack) stack.pop()
                        }
                        return
                    }
                    boolean active = true
                    for (def s : stack) {
                        if (!s) { active = false; break }
                    }
                    if (active) {
                        outLines.add(uncommentPreprocessLine(line))
                    }
                }
                outFile.write(outLines.join('\n'), 'UTF-8')
            }
        }
    }

    static String uncommentPreprocessLine(String line) {
        def matcher = (line =~ /^(\s*)\/\/\$\$ ?(.*)$/)
        return matcher.matches() ? matcher.group(1) + matcher.group(2) : line
    }

    static boolean evaluate(String expr, int ver) {
        def m = (expr =~ /^\s*MC\s*(>=|<=|==|!=|<|>)\s*(\d+)\s*$/)
        if (m.matches()) {
            def op = m.group(1)
            def val = Integer.parseInt(m.group(2))
            switch (op) {
                case '>=': return ver >= val
                case '<=': return ver <= val
                case '==': return ver == val
                case '!=': return ver != val
                case '<':  return ver < val
                case '>':  return ver > val
            }
        }
        return true
    }
}

def preprocessTask = tasks.register('preprocessJava', PreprocessTask) {
    srcDir = sharedSrcDir
    outDir = preprocessedDir
    targetMcVersion = project.mcVersion
}

sourceSets {
    main {
        java {
            setSrcDirs([])
            srcDir(preprocessedDir)
        }
        resources {
            setSrcDirs([])
            // 版本资源必须优先进入 jar，尤其是 fabric.mod.json；
            // 根目录资源作为共享补充，重复项由 duplicatesStrategy 处理。
            srcDir versionResDir
            srcDir sharedResDir
        }
    }
    test {
        java {
            setSrcDirs([])
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn(preprocessTask)
}

tasks.named('compileTestJava').configure {
    enabled = false
}

tasks.withType(Test).configureEach {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
