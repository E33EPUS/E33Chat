plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-Forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {

    mappings channel: mapping_channel, version: mapping_version

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.configs', 'mixins.e33chat.json'
            jvmArg '-Dmixin.env.remapRefMap=true'
            jvmArg "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.configs', 'mixins.e33chat.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.e33chat.refmap.json'
    config 'mixins.e33chat.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        url 'https://maven.kosmx.dev/'
    }
    // China mirrors last: fallback for local builds; overseas CI resolves from the canonical repos above
    maven {
        url 'https://maven.aliyun.com/repository/public'
        allowInsecureProtocol = true
    }
    maven {
        url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        allowInsecureProtocol = true
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'mixins.e33chat.json'
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// 把 AP 生成的 refmap 复制到 resources（compileJava 时 AP 生成到 tmp）
tasks.register('copyRefmap', Copy) {
    from "${buildDir}/tmp/compileJava"
    into "${buildDir}/resources/main"
    include 'mixins.e33chat.refmap.json'
}
compileJava.finalizedBy 'copyRefmap'

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // JUnit can't be resolved in the offline dev environment; run tests explicitly
    // via `gradlew test -PrunTests` (CI does this). Default `build` skips them.
    onlyIf { project.hasProperty('runTests') }
}
compileTestJava.dependsOn copyRefmap

// 在 dev 环境生成 MANIFEST.MF，让 MixinPlatformAgentDefault 发现 mixin 配置
tasks.register('writeDevManifest') {
    doLast {
        def mfDir = file("${buildDir}/resources/main/META-INF")
        mfDir.mkdirs()
        file("${mfDir}/MANIFEST.MF").text =
            'Manifest-Version: 1.0\n' +
            'MixinConfigs: mixins.e33chat.json\n'
        logger.lifecycle('Generated MANIFEST.MF with MixinConfigs for dev environment')
    }
}
processResources.finalizedBy 'writeDevManifest'
jar.dependsOn copyRefmap

// ---------------------------------------------------------------------------
// Store publishing (Modrinth + CurseForge), same pipeline as AtomChat.
// Project IDs live in gradle.properties (modrinth_project_id /
// curseforge_project_id); tokens come from the CI environment only. Tasks
// skip themselves when unconfigured, so local builds and a CI without
// secrets stay green instead of failing the release.
// ---------------------------------------------------------------------------

def storeVersion = "Forge-${project.minecraft_version}-${project.mod_version}"

def changelogFor(version) {
    def text = rootProject.file('CHANGELOG.md').getText('UTF-8')
    def start = text.indexOf("## v${version}")
    if (start < 0) {
        return "E33Chat ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    return section.trim()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = (project.findProperty('modrinth_project_id') ?: '').toString()
    versionNumber = storeVersion
    versionType = "release"
    uploadFile = jar
    gameVersions = [project.minecraft_version]
    loaders = ["Forge"]
    changelog = changelogFor(project.version)
    }

def mrProjectId = (project.findProperty('modrinth_project_id') ?: '').toString()
tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") && !mrProjectId.isEmpty() }
}

def cfProjectId = (project.findProperty('curseforge_project_id') ?: '').toString()
def cfConfigured = cfProjectId ==~ /\d+/

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    onlyIf { cfConfigured && System.getenv("CURSEFORGE_TOKEN") }

    if (cfConfigured) {
        def main = upload(cfProjectId as int, jar)
        main.changelogType = 'markdown'
        main.changelog = changelogFor(project.version)
        main.releaseType = 'release'
        main.displayName = storeVersion
        main.addGameVersion project.minecraft_version
        main.addModLoader 'Forge'
        main.addJavaVersion 'Java 17'
        // CurseForge rejects uploads without an environment tag (error 1021).
        main.addEnvironment 'Client', 'Server'
CF    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publish the mod to Modrinth and CurseForge.'
    dependsOn 'modrinth', 'curseforge'
}
