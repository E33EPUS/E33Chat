# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: show build environment
        run: |
          java -version
          ./gradlew --version
      - name: build
        shell: bash
        run: |
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}
      - name: summarize gradle failure
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          log = Path("gradle-build.log").read_text(errors="replace").splitlines()
          def annotate(title, lines):
              text = "\n".join(lines)
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{text}")
          annotate("Gradle build failed - head", log[:120])
          annotate("Gradle build failed - tail", log[-120:])
          PY
          fi
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: versions/*/build/libs/*.jar
      - name: capture gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle build log
          path: gradle-build.log
      - name: capture gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle reports
          path: |
            build/reports/**
            versions/*/build/reports/**
