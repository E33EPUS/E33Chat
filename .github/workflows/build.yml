name: Build

# Branch/PR CI: builds all three loader branches on every push so a change on
# one branch that breaks another is caught immediately. Forge runs on Java 17
# (MC 1.20.1), NeoForge and Fabric on Java 21 (MC 1.21.1).

on:
  push:
    branches: ["Forge-1.20.1", "Neoforge-1.21.1", "Fabric-1.21.1"]
  pull_request:
    branches: ["Forge-1.20.1", "Neoforge-1.21.1", "Fabric-1.21.1"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Forge
            java: "17"
            tests: "-PrunTests"
          - loader: NeoForge
            java: "21"
            tests: "-PrunTests"
          - loader: Fabric
            java: "21"
            tests: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # PR builds read the cache only; pushes refresh it.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-includes: |
            caches
            notifications
            .gradle/loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build ${{ matrix.tests }} --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: e33chat-${{ matrix.loader }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
