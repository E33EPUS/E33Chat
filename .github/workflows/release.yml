# Release workflow: triggered when a v* tag (e.g. v1.0.0) is pushed.
# Builds all versions with Gradle, then creates a GitHub Release with
# auto-generated release notes and uploads the JAR artifacts.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        shell: bash
        run: |
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: summarize gradle failure
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          log = Path("gradle-build.log").read_text(errors="replace").splitlines()
          def annotate(title, lines):
              text = "\n".join(lines)
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{text}")
          failure_markers = (
              "FAILURE:",
              "* What went wrong:",
              "Caused by:",
              "Exception",
              "Could not",
              "failed",
              "FAILED",
          )
          important = []
          for i, line in enumerate(log):
              if any(marker in line for marker in failure_markers):
                  start = max(0, i - 6)
                  end = min(len(log), i + 18)
                  important.extend(log[start:end])
                  important.append("")
          if important:
              annotate("Gradle build failed - important lines", important[-180:])
          annotate("Gradle build failed - tail", log[-180:])
          PY
          fi

      - name: create github release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: versions/*/build/libs/*.jar
