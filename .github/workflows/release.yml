name: Release

# Tag push (v*) runs the full pipeline: build Forge + NeoForge + Fabric -> one
# GitHub Release carrying all three jars (bilingual notes from CHANGELOG.md)
# -> publish each loader to Modrinth and CurseForge. The Gradle publish tasks
# skip themselves when MODRINTH_TOKEN / CURSEFORGE_TOKEN or the project IDs in
# gradle.properties are unset, so a partially configured store still releases.
# workflow_dispatch allows re-running publishing alone without re-tagging:
# the stores input picks Modrinth / CurseForge (e.g. adding a token later —
# re-uploading an existing version to Modrinth would hit its duplicate-file
# guard), the loaders input narrows the matrix.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      stores:
        description: Stores to publish (manual dispatch only)
        required: false
        default: all
        type: choice
        options:
          - all
          - modrinth
          - curseforge
      loaders:
        description: Loaders to publish (manual dispatch only)
        required: false
        default: all
        type: choice
        options:
          - all
          - forge
          - neoforge
          - fabric

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Forge
            branch: Forge-1.20.1
            java: "17"
            tests: "-PrunTests"
          - loader: NeoForge
            branch: Neoforge-1.21.1
            java: "21"
            tests: "-PrunTests"
          - loader: Fabric
            branch: Fabric-1.21.1
            java: "21"
            tests: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            .gradle/loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify branch version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::${{ matrix.loader }} branch mod_version=${ACTUAL} does not match tag ${EXPECTED}"
            exit 1
          fi
          echo "Branch ${ACTUAL} matches tag ${EXPECTED}"

      - name: Build and test
        run: ./gradlew build ${{ matrix.tests }} --no-daemon

      - name: Stage mod jar (exclude sources jar)
        run: |
          mkdir -p release-out
          find build/libs -name "*.jar" ! -name "*sources*" -exec cp {} release-out/ \;
          ls -la release-out

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.loader }}
          path: release-out/*.jar
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Forge branch for release notes
        uses: actions/checkout@v4
        with:
          ref: Forge-1.20.1
          fetch-depth: 0
          fetch-tags: true

      - name: Download all mod jars
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten release jars
        run: |
          mkdir -p release-out
          find artifacts -name "*.jar" ! -name "*sources*" -exec cp {} release-out/ \;
          ls -la release-out

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          python3 - <<'PY'
          import os
          version = os.environ["VERSION"]
          # Convention: the release body is the whole version section from
          # RELEASE_NOTES.md (Chinese summary first, English block last) — a short summary, not the CHANGELOG.
          with open("RELEASE_NOTES.md", encoding="utf-8") as f:
              notes = f.read()
          start = notes.find("## v" + version)
          if start < 0:
              start = notes.find("## v" + version.split("-")[0])
          if start < 0:
              raise SystemExit(f"ERROR: no '## v{version}' section in RELEASE_NOTES.md — write it before tagging")
          end = notes.find("\n## ", start + 1)
          section = (notes[start:end] if end > start else notes[start:]).strip()
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(section + "\n")
          PY

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.jar
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

  publish:
    name: Publish (${{ matrix.loader }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: Forge
            branch: Forge-1.20.1
            java: "17"
            store_prefix: Forge
          - loader: NeoForge
            branch: Neoforge-1.21.1
            java: "21"
            store_prefix: NeoForge
          - loader: Fabric
            branch: Fabric-1.21.1
            java: "21"
            store_prefix: Fabric

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            .gradle/loom-cache

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve store task
        id: store
        run: |
          case "${{ github.event.inputs.stores }}" in
            modrinth)  echo "task=modrinth"   >> "$GITHUB_OUTPUT" ;;
            curseforge) echo "task=curseforge" >> "$GITHUB_OUTPUT" ;;
            *)          echo "task=publishMods" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and publish to Modrinth and CurseForge
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            github.event.inputs.loaders == 'all' ||
            (matrix.loader == 'Forge' && github.event.inputs.loaders == 'forge') ||
            (matrix.loader == 'NeoForge' && github.event.inputs.loaders == 'neoforge') ||
            (matrix.loader == 'Fabric' && github.event.inputs.loaders == 'fabric')
          }}
        # --no-configuration-cache: minotaur touches Task.project at execution
        # time, which the configuration cache (enabled on the Neo branch) forbids.
        run: ./gradlew build ${{ steps.store.outputs.task }} --no-daemon --no-configuration-cache
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

      # A store task can report success while the file never lands (Modrinth
      # skips a duplicate silently; the CurseForge upload endpoint once returned
      # an id for a file that was never persisted). Verify against the public
      # APIs so a non-upload fails the release instead of shipping green.
      - name: Verify the store received this version
        if: >-
          ${{
            github.event_name != 'workflow_dispatch' ||
            github.event.inputs.loaders == 'all' ||
            (matrix.loader == 'Forge' && github.event.inputs.loaders == 'forge') ||
            (matrix.loader == 'NeoForge' && github.event.inputs.loaders == 'neoforge') ||
            (matrix.loader == 'Fabric' && github.event.inputs.loaders == 'fabric')
          }}
        env:
          PREFIX: ${{ matrix.store_prefix }}
          STORES: ${{ steps.store.outputs.task }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          MR=$(grep '^modrinth_project_id=' gradle.properties | cut -d= -f2 | tr -d '\r')
          CF=$(grep '^curseforge_project_id=' gradle.properties | cut -d= -f2 | tr -d '\r')
          EXPECTED="${PREFIX}-${MC}-${VER}"
          echo "expecting store version: ${EXPECTED} (stores=${STORES})"
          EXPECTED="$EXPECTED" STORES="$STORES" MR="$MR" CF="$CF" python3 - <<'PY'
          import json, os, sys, urllib.request

          expected, stores = os.environ["EXPECTED"], os.environ["STORES"]
          failures = []

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {
                  "Accept": "application/json", "User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          if stores in ("modrinth", "publishMods") and os.environ.get("MR"):
              try:
                  versions = get("https://api.modrinth.com/v2/project/%s/version" % os.environ["MR"])
                  if any(v.get("version_number") == expected for v in versions):
                      print("Modrinth OK:", expected)
                  else:
                      failures.append("Modrinth: %s not present" % expected)
              except Exception as e:
                  failures.append("Modrinth check error: %r" % (e,))

          if stores in ("curseforge", "publishMods") and os.environ.get("CF"):
              try:
                  data = get("https://www.curseforge.com/api/v1/mods/%s/files?pageIndex=0&pageSize=25&sort=dateCreated" % os.environ["CF"])
                  names = [f.get("displayName") for f in data.get("data", [])]
                  if expected in names:
                      print("CurseForge OK:", expected)
                  else:
                      failures.append("CurseForge: %s not present (newest: %s)" % (expected, names[:3]))
              except Exception as e:
                  failures.append("CurseForge check error: %r" % (e,))

          if failures:
              for f in failures:
                  print("::error::" + f)
              sys.exit(1)
          print("store verification passed:", expected)
          PY
