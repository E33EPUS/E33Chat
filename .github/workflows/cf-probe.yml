name: cf-probe

# Temporary diagnostic workflow (deleted once the CF publish issue is solved).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Public file list
        run: |
          echo "== public =="
          curl -s --max-time 40 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -w "\nhttp=%{http_code}\n" "https://www.curseforge.com/api/v1/mods/1599940/files?pageIndex=0&pageSize=6&sort=dateCreated" | head -c 900

      - name: Authenticated file list
        run: |
          echo "== with token =="
          curl -s --max-time 40 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" -w "\nhttp=%{http_code}\n" "https://www.curseforge.com/api/v1/mods/1599940/files?pageIndex=0&pageSize=6&sort=dateCreated" | head -c 900

      - name: Authoring ping
        run: |
          echo "== game/versions http =="
          curl -s -o /dev/null -w "%{http_code}\n" -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" "https://minecraft.curseforge.com/api/game/versions"
