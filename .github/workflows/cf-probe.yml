name: cf-probe

# Temporary diagnostic workflow (deleted once the CF publish issue is solved).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Public CF file list for 2.4.11
        run: |
          curl -s --max-time 40 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" "https://www.curseforge.com/api/v1/mods/1599940/files?pageIndex=0&pageSize=25&sort=dateCreated" -o /tmp/l.json -w "http=%{http_code}\n"
          python3 -c "import json;d=json.load(open('/tmp/l.json'));[print(f.get('id'),'|',f.get('displayName'),'|',f.get('gameVersions'),'|',f.get('dateCreated'),'| status=',f.get('status')) for f in d.get('data',[]) if '2.4.11' in (f.get('displayName') or '')]"
