name: cf-probe

# Temporary diagnostic workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Raw JSON for the uploaded ids
        run: |
          for id in 8848269 8848273 8847778; do
            echo "===== $id ====="
            curl -s --max-time 30 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" "https://www.curseforge.com/api/v1/mods/1599940/files/$id" -w "\nhttp=%{http_code}\n"
            echo
          done
