name: cf-probe

# Temporary diagnostic workflow (deleted once the CF publish issue is solved).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Raw per-file JSON for the two uploaded ids
        run: |
          for id in 8848269 8848273; do
            echo "== $id =="
            curl -s --max-time 30 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" "https://www.curseforge.com/api/v1/mods/1599940/files/$id" -o /tmp/f.json -w "http=%{http_code}\n"
            python3 -c "import json;d=json.load(open('/tmp/f.json'));print(' keys:', sorted(d.keys()));print(' displayName:', d.get('displayName'));print(' fileName:', d.get('fileName'));print(' status:', d.get('status'));print(' fileStatus:', d.get('fileStatus'))" 2>&1 | head -8
          done
