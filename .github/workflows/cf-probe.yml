name: cf-probe

# Temporary diagnostic workflow (deleted once the CF publish issue is solved).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Status of the two uploaded file ids
        run: |
          for id in 8848269 8848273; do
            echo "== file $id =="
            curl -s --max-time 30 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" "https://www.curseforge.com/api/v1/mods/1599940/files/$id" -o /tmp/f.json -w "http=%{http_code}\n"
            tr ',' '\n' < /tmp/f.json | grep -E '"id"|"displayName"|"status"|"fileName"|"errorMessage"' | head -8
          done
          echo "== pending list with token =="
          curl -s --max-time 30 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" "https://www.curseforge.com/api/v1/mods/1599940/files?pageIndex=0&pageSize=5&sort=dateCreated" -o /tmp/l.json -w "http=%{http_code}\n"
          tr ',' '\n' < /tmp/l.json | grep -E '"displayName"' | head -6
