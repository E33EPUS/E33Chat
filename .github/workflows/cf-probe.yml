name: cf-probe

# Temporary diagnostic workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Upload three times, spaced, checking persistence each time
        run: |
          curl -sL -o /tmp/fab.jar "https://github.com/E33EPUS/E33Chat/releases/download/v2.4.11/e33chat-Fabric-1.21.1-2.4.11.jar"
          for n in 1 2 3; do
            echo "===== attempt $n ====="
            RESP=$(curl -s -X POST "https://minecraft.curseforge.com/api/projects/1599940/upload-file" \
              -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" \
              -F 'metadata={"displayName":"Fabric-retry-A'$n'-1.21.1-2.4.11","releaseType":"release","gameVersions":[11779,7499,9638,9639,11135],"changelogType":"markdown","changelog":"retry"};type=application/json' \
              -F "file=@/tmp/fab.jar" -w " HTTP=%{http_code}")
            echo "resp=$RESP"
            ID=$(echo "$RESP" | sed -n 's/.*"id":\([0-9]*\).*/\1/p')
            sleep 20
            echo "checking id=$ID"
            curl -s --max-time 25 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" "https://www.curseforge.com/api/v1/mods/1599940/files/$ID" -w " http=%{http_code}\n"
            sleep 25
          done
