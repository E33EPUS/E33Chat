name: cf-probe

# Temporary diagnostic workflow (deleted once the CF publish issue is solved).
# Local network cannot reach minecraft.curseforge.com (Cloudflare blocks it),
# so the CF website API is queried from a runner instead.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Website file list (includes pending files)
        run: |
          curl -s --max-time 40 -H "User-Agent: Mozilla/5.0" -H "Accept: application/json" \
            "https://www.curseforge.com/api/v1/mods/1599940/files?pageIndex=0&pageSize=15&sort=dateCreated&sortDescending=true" \
            -o /tmp/wf.json -w "http=%{http_code} bytes=%{size_download}\n"
          python3 -c "import json;d=json.load(open('/tmp/wf.json'));[print(f.get('id'),'|',f.get('displayName'),'|',f.get('fileName'),'| status=',f.get('fileStatus'),'| avail=',f.get('isAvailable'),'|',f.get('fileDate')) for f in d.get('data',[])[:15]]"

      - name: Authenticated file list (shows pending/unapproved)
        run: |
          for q in "" "&includePending=true" "&status=1" ; do
            echo "== query:$q"
            curl -s --max-time 40 -H "User-Agent: Mozilla/5.0" -H "Accept: application/json"               -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}"               "https://www.curseforge.com/api/v1/mods/1599940/files?pageIndex=0&pageSize=10&sort=dateCreated$q"               -o /tmp/auth.json -w "http=%{http_code} bytes=%{size_download}
"
            python3 -c "import json;d=json.load(open('/tmp/auth.json'));[print(' ',f.get('id'),'|',f.get('displayName'),'| rel=',f.get('releaseType'),'| status=',f.get('fileStatus'),'| ',f.get('dateCreated')) for f in d.get('data',[])[:10]]"
          done
