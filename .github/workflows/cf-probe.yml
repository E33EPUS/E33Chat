name: cf-probe

# Temporary diagnostic: local network is blocked by Cloudflare on
# minecraft.curseforge.com, so drive the authoring API from a runner.
# Reads game-version / loader ids and the token's project list.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Game version + loader ids
        run: |
          curl -s -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" \
            https://minecraft.curseforge.com/api/game/versions -o /tmp/gv.json
          echo "bytes: $(wc -c < /tmp/gv.json)"
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/gv.json'))
          print('total entries:', len(d))
          print('--- loader candidates ---')
          for v in d:
              if v.get('name') in ('Fabric', 'NeoForge', 'Forge'):
                  print(v.get('id'), '|', v.get('name'), '|', v.get('gameVersionTypeID'))
          print('--- mc version candidates ---')
          for v in d:
              if v.get('name') in ('1.21.1', '1.20.1'):
                  print(v.get('id'), '|', v.get('name'), '|', v.get('gameVersionTypeID'))
          PY

      - name: Project read via authoring API
        run: |
          curl -s -o /dev/null -w "single=%{http_code}\n" \
            -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" \
            https://minecraft.curseforge.com/api/projects/1599940
          curl -s -o /tmp/list.json -w "list=%{http_code}\n" \
            -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" \
            https://minecraft.curseforge.com/api/projects
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/list.json'))
              for p in d:
                  print('owned:', p.get('id'), '|', p.get('name'), '|', p.get('slug'))
          except Exception as e:
              print('list parse failed:', e, open('/tmp/list.json').read()[:120])
          PY
