name: cf-probe

# Temporary diagnostic workflow (deleted once the CF publish issue is solved).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show 2.4.11 files on CurseForge
        run: |
          curl -s --max-time 40 -H "Accept: application/json" -H "User-Agent: Mozilla/5.0" "https://www.curseforge.com/api/v1/mods/1599940/files?pageIndex=0&pageSize=30&sort=dateCreated" -o /tmp/l.json -w "http=%{http_code}\n"
          echo "--- displayName / gameVersions / id ---"
          tr ',' '\n' < /tmp/l.json | grep -E '"displayName"|"gameVersions"|"id"' | head -40
