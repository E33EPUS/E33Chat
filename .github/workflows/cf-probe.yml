name: cf-probe

# Temporary diagnostic workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Re-upload the known-good Forge jar (with headers)
        run: |
          curl -sL -o /tmp/forge.jar "https://github.com/E33EPUS/E33Chat/releases/download/v2.4.11/e33chat-Forge-1.20.1-2.4.11.jar"
          echo "size=$(wc -c < /tmp/forge.jar)"
          echo "--- POST (headers + body) ---"
          curl -s -i -X POST "https://minecraft.curseforge.com/api/projects/1599940/upload-file" \
            -H "X-Api-Token: ${{ secrets.CURSEFORGE_TOKEN }}" \
            -F 'metadata={"displayName":"Forge-retest-1.20.1-2.4.11","releaseType":"release","gameVersions":[9990,7498,9638,9639],"changelogType":"markdown","changelog":"retest"};type=application/json' \
            -F "file=@/tmp/forge.jar" | head -30
