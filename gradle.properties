# 仓库级身份：所有目标共用一份，各平台不许自己定义。
#
# 【为什么只有一处】一次发版所有目标出的是同一个版本号的 jar —— 玩家在不同
# 加载器上装到的 vX.Y.Z 必须是同一次改动。留在各平台里，它们就能各自漂移，
# 而"某个目标悄悄落后"正是这套结构要治的病（2.4.11 的去重修复只落在 Forge
# 端，Neo/Fabric 端悄悄缺了两个版本，就是这个病）。
#
# 【读不到就失败，不给默认值】各平台由 gradle/e33chat-layers.gradle 读本文件，
# 缺键直接抛 GradleException。悄悄退回一个默认值等于把那个病放回来，而且是静默的：
# jar 照样出得来，只是版本号对不上。

mod_id=e33chat
mod_name=E33Chat
mod_license=MIT
mod_group_id=com.niuqu.chatbubble
mod_authors=E33EPUS
mod_description=Rebuilds the vanilla chat HUD in a chat-app style
mod_version=2.4.13

# 发布目标（同样的值对所有目标成立）
